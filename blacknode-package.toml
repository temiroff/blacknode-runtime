[package]
name = "blacknode-runtime"
version = "0.4.8"
description = "Authenticated remote deployment, rollout, rollback, logs, and service supervision for Blacknode devices."
requires-blacknode = ">=0.3.0"
layer = "runtime"
component-mode = true

[components.deployment]
description = "Independently deployable device agent for artifact staging, rollout, rollback, logs, and service supervision."
default = true
capabilities = [
  "deployment.manifest",
  "deployment.remote-services",
  "deployment.artifact-staging",
  "deployment.rollout",
  "deployment.rollback",
  "deployment.logs",
  "deployment.supervision",
  "deployment.ros2-topic-streams",
]
