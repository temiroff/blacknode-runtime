name: Package CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Runtime package tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out Runtime
        uses: actions/checkout@v6

      - name: Check out Blacknode
        uses: actions/checkout@v6
        with:
          repository: temiroff/Blacknode
          path: core

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -e ./core pytest

      - name: Run Runtime tests
        run: python -m pytest tests

      - name: Validate package catalog
        env:
          PYTHONPATH: core/python
        run: python -m blacknode.cli packages validate-catalog .
